<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitNotes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GitNotes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600;700&family=Lora:wght@400;700&family=Pacifico&family=Patrick+Hand&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#43304a;--soft:#8a7590;--accent:linear-gradient(135deg,#ff8fb8,#ff6a9f);--pink:#ff7fae;--a:.82;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#ffe9f2}
body{margin:0;font-family:Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;touch-action:manipulation}
#bgLayer{position:fixed;inset:0;z-index:-1;background:#ffe9f2 linear-gradient(160deg,#ffe8f1 0%,#f3e8ff 100%) center/cover no-repeat;transform:translateZ(0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .12s,background .15s}
button:active{transform:scale(.92)}
svg{display:block}
.glass{background:rgba(255,255,255,var(--a));border:1px solid rgba(255,255,255,calc(var(--a) * .9));border-radius:22px;box-shadow:0 4px 18px rgba(120,60,110,.1)}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(120,60,110,.14);display:grid;place-items:center;flex:none}
.ib.act,.ib.locked{background:var(--accent);color:#fff}
.pill{padding:10px 18px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(120,60,110,.14);font-weight:700}
.pill.pri{background:var(--accent);color:#fff}
.pill.sm{padding:8px 14px}
.sp{flex:1}
.clear .glass,.clear .note{box-shadow:none;border-color:transparent}
.clear h1,.clear small.cnt,.clear #title,.clear #body,.clear .note,.clear #wt,.clear #wb,.clear .empty{text-shadow:0 0 5px #fff,0 0 10px #fff}

.view{display:none;min-height:100vh;padding:calc(var(--sat) + 16px) 16px 16px;max-width:760px;margin:auto}
.view.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* HOME */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:50px}
.head h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.4px;line-height:1.1}
small.cnt{color:var(--soft);font-weight:600;font-size:.85rem}
.acts{display:flex;gap:8px}
#selbar{padding:5px 8px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;margin-bottom:16px;color:var(--soft)}
#q{flex:1;border:0;outline:0;background:none;color:var(--ink);min-width:0}
#q::placeholder{color:var(--soft)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:120px}
.note{border-radius:22px;padding:15px 15px 30px;height:176px;overflow:hidden;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background-color:rgba(255,255,255,var(--a));background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.7);
  box-shadow:0 4px 18px rgba(120,60,110,.1);content-visibility:auto;contain-intrinsic-size:176px;transition:transform .15s,box-shadow .15s}
.note:active{transform:scale(.97)}
.note b{display:block;font-size:1.05rem;margin-bottom:6px;padding-right:18px;text-shadow:0 0 8px #fffc}
.note p{margin:0;font-size:.86rem;line-height:1.45;color:#43304acc;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 0 6px #fff9}
.note small{position:absolute;left:15px;bottom:11px;font-size:.72rem;color:var(--soft);font-weight:600;text-shadow:0 0 6px #fff}
.note .pinI{position:absolute;top:12px;right:12px;color:#ff6a9f}
.note .chk{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #e2d2e6;display:none;place-items:center;color:#fff}
.selmode .note .chk{display:grid}.selmode .note .pinI{display:none}
.note.sel{outline:3px solid #ff6a9f;outline-offset:-3px;transform:scale(.97)}
.note.sel .chk{background:var(--accent);border-color:transparent}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--soft);font-weight:600}
.empty div{font-size:2.4rem;margin-bottom:8px}
#fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(var(--sab) + 22px);width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(255,90,150,.42);z-index:5;display:grid;place-items:center}

/* EDITOR */
.top{display:flex;align-items:center;gap:8px;padding:8px;position:sticky;top:calc(var(--sat) + 8px);z-index:6;margin-bottom:12px}
#title{width:100%;border:0;outline:0;padding:16px 20px;margin-bottom:12px;font-size:1.65rem;font-weight:800;font-family:inherit;color:var(--ink);border-radius:22px}
#title::placeholder{color:#43304a66}
#body{padding:20px;min-height:56vh;outline:0;line-height:1.7;font-size:1.05rem;word-break:break-word;margin-bottom:100px}
#body:empty:before{content:attr(data-ph);opacity:.4}
#body ul,#body ol{margin:.4em 0;padding-left:1.5em}
#dock{position:fixed;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);width:min(736px,calc(100% - 24px));
  display:flex;gap:2px;align-items:center;padding:7px;overflow-x:auto;z-index:7;transition:transform .25s,opacity .25s;scrollbar-width:none;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 8px 26px rgba(120,60,110,.22)}
#dock::-webkit-scrollbar{display:none}
#dock.hide{transform:translate(-50%,150%);opacity:0;pointer-events:none}
#dock button,#dock label{min-width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;position:relative;font-weight:700;padding:0 6px;grid-auto-flow:column;gap:1px}
#dock button:active,#dock label:active{background:#ffe3ef}
#dock button.act{background:#ffe0ee;color:#e0457f}
#dock label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#dock label u{position:absolute;bottom:5px;left:10px;right:10px;height:3px;border-radius:3px}
.sep{width:1px;height:22px;background:#43304a22;flex:none;margin:0 3px}
#pop,#menu{position:fixed;display:none;z-index:9;background:#fff;border-radius:20px;padding:8px;box-shadow:0 12px 34px #0003}
#pop{left:50%;bottom:calc(var(--sab) + 78px);transform:translateX(-50%);flex-wrap:wrap;gap:6px;max-width:min(380px,92vw);justify-content:center}
#menu{right:max(16px,calc(50% - 364px));top:calc(var(--sat) + 70px);flex-direction:column;min-width:200px}
#pop.on,#menu.on{display:flex;animation:pop .15s}
#pop button{padding:9px 15px;border-radius:12px;background:#fff4f8;font-size:1rem}
#menu button{padding:12px 14px;border-radius:12px;text-align:left;font-weight:600}
#menu button:active{background:#ffe3ef}

/* WIDGET VIEW */
#widget.on{display:flex;flex-direction:column;justify-content:center}
#wcard{padding:28px;min-height:58vh;transform:rotate(-.6deg)}
#wt{margin:0 0 12px;font-size:1.7rem;font-weight:800}
#wb{line-height:1.7;font-size:1.1rem;word-break:break-word}
.wbtn{position:fixed;bottom:calc(var(--sab) + 20px)}
#wHome{left:18px}#wEdit{right:18px}

/* DIALOGS */
dialog{border:0;border-radius:28px;padding:22px;width:min(390px,92vw);color:var(--ink);box-shadow:0 24px 70px #0005;background:#fffafc}
dialog[open]{animation:pop .2s}
dialog::backdrop{background:#2b1630aa}
dialog h3{margin:0 0 14px;font-size:1.25rem}
dialog p{font-size:.88rem;color:var(--soft);margin:10px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.sws{display:flex;gap:9px;flex-wrap:wrap}
.sws i{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0003;cursor:pointer}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin:18px 0 4px}
input[type=range]{width:100%;accent-color:var(--pink);height:28px}
input[type=color]{width:42px;height:34px;border:0;border-radius:10px;padding:0;background:none;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;font-weight:600;max-width:90vw;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px #0004}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#tact{color:#ffb3d1;font-weight:800}
</style>
</head>
<body>
<div id="bgLayer"></div>

<!-- HOME -->
<div id="home" class="view on">
  <div id="hdr" class="head">
    <div><h1>GitNotes</h1><small class="cnt" id="count"></small></div>
    <div class="acts">
      <button class="ib clrb" id="clrHome" data-ic="drop" title="Transparent panels"></button>
      <button class="ib" id="bgHome" data-ic="palette" title="Background"></button>
      <button class="ib" id="cloud" data-ic="cloud" title="Backup"></button>
    </div>
  </div>
  <div id="selbar" class="head glass" hidden>
    <button class="ib" id="selX" data-ic="close"></button>
    <b id="selCount"></b><span class="sp"></span>
    <button class="pill sm" id="selAll">All</button>
    <button class="ib" id="selPin" data-ic="pin"></button>
    <button class="ib" id="selDel" data-ic="trash"></button>
  </div>
  <label class="search glass"><span data-ic="search"></span><input id="q" placeholder="Search notes"></label>
  <div id="grid"></div>
  <button id="fab" data-ic="plus" data-sz="28" title="New note"></button>
</div>

<!-- EDITOR -->
<div id="editor" class="view">
  <div class="top glass">
    <button class="ib" id="back" data-ic="back" title="Back"></button>
    <span class="sp"></span>
    <button class="ib" id="lock" title="Lock / unlock editing"></button>
    <button class="ib clrb" id="clr" data-ic="drop" title="Transparent panels"></button>
    <button class="ib" id="bgNote" data-ic="palette" title="Background"></button>
    <button class="ib" id="more" data-ic="more" title="More"></button>
  </div>
  <input id="title" class="glass" placeholder="Heading">
  <div id="body" class="glass" contenteditable="true" data-ph="Write something cute..."></div>
  <div id="dock">
    <button data-c="undo" data-ic="undo"></button>
    <button data-c="redo" data-ic="redo"></button>
    <span class="sep"></span>
    <button data-c="bold"><b>B</b></button>
    <button data-c="italic"><i>I</i></button>
    <button data-c="underline"><u>U</u></button>
    <button data-c="strikeThrough"><s>S</s></button>
    <span class="sep"></span>
    <button data-c="insertUnorderedList" data-ic="ul"></button>
    <button data-c="insertOrderedList" data-ic="ol"></button>
    <button data-c="justifyLeft" data-ic="left"></button>
    <button data-c="justifyCenter" data-ic="center"></button>
    <span class="sep"></span>
    <button id="fontBtn">Aa</button>
    <button id="sizeBtn"><span style="font-size:.78em">A</span><span style="font-size:1.2em">A</span></button>
    <span class="sep"></span>
    <label title="Text color">A<u id="tcU" style="background:#43304a"></u><input type="color" id="tc" value="#43304a"></label>
    <label title="Highlight"><span data-ic="marker"></span><u id="hcU" style="background:#fff3a3"></u><input type="color" id="hc" value="#fff3a3"></label>
  </div>
  <div id="pop"></div>
  <div id="menu"></div>
</div>

<!-- WIDGET VIEW -->
<div id="widget" class="view">
  <div id="wcard" class="glass"><h2 id="wt"></h2><div id="wb"></div></div>
  <button class="ib wbtn" id="wHome" data-ic="home"></button>
  <button class="ib wbtn" id="wEdit" data-ic="edit"></button>
</div>

<!-- BACKGROUND -->
<dialog id="bgDlg">
  <h3>Background</h3>
  <div class="sws" id="sw"></div>
  <div class="row">
    <label class="pill" style="display:flex;gap:8px;align-items:center">Color <input type="color" id="bgColor" value="#ffe3ef"></label>
    <button class="pill" id="bgImgBtn">Image</button>
    <button class="pill" id="bgClear">Reset</button>
  </div>
  <div class="lbl"><span>Panel transparency</span><span id="aVal"></span></div>
  <input type="range" id="alpha" min="0" max="100">
  <input type="file" id="bgFile" accept="image/*" hidden>
  <div class="row"><button class="pill pri" id="bgClose">Done</button></div>
</dialog>

<!-- BACKUP -->
<dialog id="gDlg">
  <h3>Backup</h3>
  <p style="margin-top:0">Back up opens your share sheet, so pick <b>Drive</b>, Files, WhatsApp, etc. No share sheet? It downloads instead. Images are included.</p>
  <div class="row"><button class="pill pri" id="up">Back up</button><button class="pill" id="down">Restore file</button></div>
  <div class="row"><button class="pill" id="copy">Copy text</button><button class="pill" id="paste">Paste text</button></div>
  <input type="file" id="impFile" hidden>
  <p id="last"></p>
  <div class="row"><button class="pill" id="gClose">Close</button></div>
</dialog>

<div id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<script>
const $=s=>document.querySelector(s);

/* ---------- icons ---------- */
const IC={
 back:'<path d="M15 18l-6-6 6-6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 unlock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 017.6-1.7"/>',
 palette:'<path d="M12 3a9 9 0 100 18c1.5 0 2.1-1.1 1.6-2.2-.5-1.1.1-2.3 1.4-2.3h2a4 4 0 004-4c0-5-4.2-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="14.5" cy="7" r="1" fill="currentColor"/>',
 more:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
 drop:'<path d="M12 3s6.5 6.4 6.5 11a6.5 6.5 0 01-13 0C5.5 9.4 12 3 12 3z"/><path d="M8.8 14.5a3.4 3.4 0 003.2 3"/>',
 cloud:'<path d="M7 18a4 4 0 01-.6-7.9 5.6 5.6 0 0110.8-1A4.5 4.5 0 0117 18H7z"/><path d="M12 17v-5M9.6 14.2L12 11.8l2.4 2.4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>',
 pin:'<path d="M9 3h6l-1 6 3 3H7l3-3-1-6zM12 12v9"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/>',
 ul:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/>',
 ol:'<path d="M10 6h10M10 12h10M10 18h10M4 5l1.6-1v5M4 14.5h3l-3 4h3"/>',
 left:'<path d="M4 6h16M4 12h10M4 18h14"/>',
 center:'<path d="M4 6h16M7 12h10M5 18h14"/>',
 marker:'<path d="M14 4l6 6-8 8H6l-2-2v-3l10-9z"/><path d="M10.5 7.5l6 6"/>',
 home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
 edit:'<path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/>'
};
const svg=(n,sz=20)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
function icons(root=document){root.querySelectorAll('[data-ic]').forEach(b=>b.innerHTML=svg(b.dataset.ic,+b.dataset.sz||20))}
icons();

/* ---------- state ---------- */
const KEY='cutenotes.v1'; // same key so old notes stay
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{notes:[],homeBg:''};
let cur=null,target='home',saved=null,tm,first=true,popKey='',sel=new Set(),selMode=false,pre=null;

let sv;const saveNow=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full')}};
const save=(d)=>{clearTimeout(sv);d?sv=setTimeout(saveNow,250):saveNow()};
function toast(t,ms=2200,act){
  const e=$('#toast'),b=$('#tact');$('#tmsg').textContent=t;
  if(act){b.hidden=false;b.textContent=act.label;b.onclick=()=>{act.fn();e.classList.remove('on')}}else b.hidden=true;
  e.classList.toggle('act',!!act);e.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('on'),ms);
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const A=v=>v==null?.82:v;
function applyA(a){
  const r=document.documentElement;r.style.setProperty('--a',a);r.classList.toggle('clear',a<.35);
  document.querySelectorAll('.clrb').forEach(b=>b.classList.toggle('act',a<.05));
}
const textOf=n=>{const d=document.createElement('div');d.innerHTML=n.html;return d.textContent};
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$('#'+id).classList.add('on');closePops();scrollTo(0,0)}

/* ---------- image storage (IndexedDB, keeps notes data tiny) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('gitnotes',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction('imgs',mode),q=fn(t.objectStore('imgs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const idbPut=(k,v)=>idb('readwrite',s=>s.put(v,k));
const idbGet=k=>idb('readonly',s=>s.get(k));
const idbDel=k=>idb('readwrite',s=>s.delete(k));
const loadImg=b=>new Promise((res,rej)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
const scale=(im,max,q)=>new Promise(res=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',q)});
async function storeImage(blob){
  const im=await loadImg(blob),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await idbPut('f:'+id,await scale(im,1280,.82));await idbPut('t:'+id,await scale(im,360,.7));return id;
}
const urls=new Map();
async function getURL(key){
  if(urls.has(key))return urls.get(key);
  const b=await idbGet(key);if(!b)return null;
  const u=URL.createObjectURL(b);urls.set(key,u);return u;
}
const cssBg=v=>v.startsWith('#')?`linear-gradient(${v},${v})`:v.startsWith('data:')?`url(${v})`:v;
function paint(el,v,thumb){
  el.dataset.bg=v||'';
  if(!v){el.style.backgroundImage='';return}
  if(v.startsWith('img:')){
    const key=(thumb?'t:':'f:')+v.slice(4);
    if(urls.has(key)){el.style.backgroundImage=`url(${urls.get(key)})`;return}
    el.style.backgroundImage='';
    getURL(key).then(u=>{if(u&&el.dataset.bg===v)el.style.backgroundImage=`url(${u})`});
    return;
  }
  el.style.backgroundImage=cssBg(v);
}
const setLayer=v=>paint($('#bgLayer'),v,false);
async function gc(){
  try{
    const used=new Set([S.homeBg,...S.notes.map(n=>n.bg)].filter(v=>v&&v.startsWith('img:')).map(v=>v.slice(4)));
    const keys=await idb('readonly',s=>s.getAllKeys());
    for(const k of keys)if(!used.has(k.slice(2))){await idbDel(k);urls.delete(k)}
  }catch(e){}
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function toData(v){if(v&&v.startsWith('img:')){const b=await idbGet('f:'+v.slice(4));if(b)return blobToData(b)}return v}
async function toRef(v){if(v&&v.startsWith('data:')){const b=await (await fetch(v)).blob();return 'img:'+await storeImage(b)}return v}
async function exportJSON(){
  const d=JSON.parse(JSON.stringify(S));d.homeBg=await toData(d.homeBg);
  for(const n of d.notes)n.bg=await toData(n.bg);
  return JSON.stringify(d);
}
async function packData(d){d.homeBg=await toRef(d.homeBg);for(const n of d.notes)n.bg=await toRef(n.bg);return d}
(async()=>{ // migrate any old inline images
  try{
    const old=[S.homeBg,...S.notes.map(n=>n.bg)].some(v=>v&&v.startsWith('data:'));
    if(!old)return;
    await packData(S);save();
    if($('#home').classList.contains('on'))renderHome();else if(cur)applyNote();
  }catch(e){}
})();
gc();

/* ---------- HOME ---------- */
function renderHome(){
  setLayer(S.homeBg);applyA(A(S.homeA));
  $('#count').textContent=S.notes.length?S.notes.length+(S.notes.length===1?' note':' notes'):'';
  const q=$('#q').value.trim().toLowerCase(),g=$('#grid');
  const list=[...S.notes].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t).filter(n=>!q||(n.title+' '+textOf(n)).toLowerCase().includes(q));
  if(!list.length){g.innerHTML=`<div class="empty glass"><div>${q?'🔍':'🌷'}</div>${q?'Nothing found':'No notes yet<br>Tap + to make your first one'}</div>`;return}
  const frag=document.createDocumentFragment();
  list.forEach((n,i)=>{
    const d=document.createElement('div');d.className='note'+(sel.has(n.id)?' sel':'');d.dataset.id=n.id;
    if(first)d.style.animation=`pop .3s ${Math.min(i,10)*30}ms both`;
    paint(d,n.bg,true);
    d.innerHTML=`<b>${esc(n.title||'Untitled')}</b><p>${esc(textOf(n).slice(0,140))}</p><small>${new Date(n.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small>${n.pin?`<span class="pinI">${svg('pin',16)}</span>`:''}<span class="chk">${svg('check',16)}</span>`;
    frag.appendChild(d);
  });
  g.replaceChildren(frag);first=false;
}
let qt;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(renderHome,120)};
function goHome(){cur=null;history.replaceState(null,'',location.pathname);renderHome();show('home')}

/* long-press select */
const grid=$('#grid');let lpT,lpFired=false,sx=0,sy=0;
function syncSel(){
  $('#hdr').hidden=selMode;$('#selbar').hidden=!selMode;$('#fab').hidden=selMode;
  $('#home').classList.toggle('selmode',selMode);
  $('#selCount').textContent=sel.size+' selected';
  grid.querySelectorAll('.note').forEach(el=>el.classList.toggle('sel',sel.has(el.dataset.id)));
  const picked=S.notes.filter(n=>sel.has(n.id));
  $('#selPin').classList.toggle('act',picked.length>0&&picked.every(n=>n.pin));
}
const exitSel=()=>{selMode=false;sel.clear();syncSel()};
grid.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.note');if(!c)return;sx=e.clientX;sy=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;selMode=true;sel.add(c.dataset.id);navigator.vibrate&&navigator.vibrate(18);syncSel()},420);
});
grid.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)clearTimeout(lpT)});
['pointerup','pointercancel','pointerleave'].forEach(t=>grid.addEventListener(t,()=>{clearTimeout(lpT);if(lpFired)setTimeout(()=>lpFired=false,60)}));
grid.addEventListener('contextmenu',e=>e.preventDefault());
grid.addEventListener('click',e=>{
  const c=e.target.closest('.note');if(!c||lpFired)return;
  const id=c.dataset.id;
  if(selMode){sel.has(id)?sel.delete(id):sel.add(id);if(!sel.size)selMode=false;syncSel()}else open(id);
});
$('#selX').onclick=exitSel;
$('#selAll').onclick=()=>{const vis=[...grid.querySelectorAll('.note')].map(e=>e.dataset.id);vis.every(i=>sel.has(i))?sel.clear():vis.forEach(i=>sel.add(i));if(!sel.size)selMode=false;syncSel()};
$('#selPin').onclick=()=>{const p=S.notes.filter(n=>sel.has(n.id)),all=p.every(n=>n.pin);p.forEach(n=>n.pin=!all);save();exitSel();renderHome()};
function delNotes(list){
  S.notes=S.notes.filter(n=>!list.includes(n));save();
  toast(list.length>1?`Deleted ${list.length} notes`:'Note deleted',5000,{label:'Undo',fn:()=>{S.notes.push(...list);save();renderHome()}});
}
$('#selDel').onclick=()=>{const p=S.notes.filter(n=>sel.has(n.id));exitSel();delNotes(p);renderHome()};

/* ---------- EDITOR ---------- */
const use=id=>{cur=S.notes.find(n=>n.id===id);saved=null;return cur};
function applyNote(){
  setLayer(cur.bg);applyA(A(cur.a));
  const sz=cur.fs||'',ff=cur.font||'';
  ['#body','#wb'].forEach(s=>{$(s).style.fontFamily=ff;$(s).style.fontSize=sz});
  ['#title','#wt'].forEach(s=>$(s).style.fontFamily=ff);
}
function open(id){
  if(!use(id))return goHome();
  $('#title').value=cur.title;$('#body').innerHTML=cur.html;
  applyNote();setMode(!cur.ro);show('editor');
}
function setMode(edit){
  cur.ro=!edit;
  const l=$('#lock');l.innerHTML=svg(edit?'unlock':'lock');l.classList.toggle('locked',!edit);
  $('#body').contentEditable=edit;$('#title').readOnly=!edit;
  $('#dock').classList.toggle('hide',!edit);
  if(!edit){closePops();document.activeElement&&document.activeElement.blur();getSelection().removeAllRanges()}
  save();
}
$('#lock').onclick=()=>{commit(true);setMode(cur.ro);toast(cur.ro?'Unlocked':'Locked',1200)};
let st;
function commit(now){
  if(!cur)return;
  const run=()=>{const t=$('#title').value,h=$('#body').innerHTML;if(cur.title!==t||cur.html!==h){cur.title=t;cur.html=h;cur.t=Date.now();save()}};
  clearTimeout(st);now?run():st=setTimeout(run,300);
}
$('#title').oninput=()=>commit();$('#body').oninput=()=>commit();
$('#body').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
$('#fab').onclick=()=>{const n={id:'n'+Date.now(),title:'',html:'',bg:'',a:null,ro:false,t:Date.now()};S.notes.push(n);save();open(n.id);$('#title').focus()};
$('#back').onclick=()=>{commit(true);goHome()};

/* menus */
function closePops(){$('#pop').classList.remove('on');$('#menu').classList.remove('on');popKey=''}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#pop,#menu,#fontBtn,#sizeBtn,#more'))closePops()});
function showPop(key,items){
  if(popKey===key){closePops();return}
  closePops();popKey=key;const p=$('#pop');p.replaceChildren();
  items.forEach(([label,fn,style])=>{
    const b=document.createElement('button');b.textContent=label;if(style)b.style.cssText=style;
    b.onmousedown=e=>e.preventDefault();b.onclick=()=>{fn();closePops()};p.appendChild(b);
  });
  p.classList.add('on');
}
$('#more').onclick=()=>{
  if($('#menu').classList.contains('on')){closePops();return}
  closePops();const m=$('#menu');m.replaceChildren();
  const items=[
    [cur.pin?'Unpin from top':'Pin to top',()=>{cur.pin=!cur.pin;save();toast(cur.pin?'Pinned':'Unpinned',1200)}],
    ['Widget view',()=>{commit(true);openWidget(cur.id,true)}],
    ['Duplicate',()=>{commit(true);const c={...cur,id:'n'+Date.now(),title:(cur.title||'Untitled')+' copy',t:Date.now(),pin:false};S.notes.push(c);save();toast('Duplicated',1500)}],
    ['Delete note',()=>{commit(true);const n=cur;goHome();delNotes([n]);renderHome()}]
  ];
  items.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{closePops();f()};m.appendChild(b)});
  m.classList.add('on');
};

/* text tools */
function dockState(){
  if(!cur||cur.ro)return;
  document.querySelectorAll('#dock [data-c]').forEach(b=>{
    if(b.dataset.c==='undo'||b.dataset.c==='redo')return;
    let on=false;try{on=document.queryCommandState(b.dataset.c)}catch(e){}
    b.classList.toggle('act',on);
  });
}
document.addEventListener('selectionchange',()=>{
  const s=getSelection();
  if(s.rangeCount&&$('#body').contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();dockState()}
});
const hasSel=()=>saved&&!saved.collapsed&&$('#body').contains(saved.commonAncestorContainer);
function ex(c,v){
  if(!cur||cur.ro)return;
  $('#body').focus();
  if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}
  document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);commit();dockState();
}
document.querySelectorAll('#dock [data-c]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{closePops();ex(b.dataset.c)}});
const FONTS=[['Quicksand','Quicksand,Nunito,system-ui,sans-serif'],['Fredoka','Fredoka,Quicksand,system-ui,sans-serif'],['Caveat','Caveat,"Segoe Script","Bradley Hand",cursive'],
 ['Pacifico','Pacifico,"Brush Script MT",cursive'],['Patrick Hand','"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive'],['Lora','Lora,Georgia,serif'],['Mono','"Courier New",ui-monospace,monospace']];
const SIZES=[['Small','2','.9rem'],['Normal','3','1.05rem'],['Big','5','1.4rem'],['Huge','6','1.8rem']];
$('#fontBtn').onmousedown=$('#sizeBtn').onmousedown=e=>e.preventDefault();
$('#fontBtn').onclick=()=>showPop('font',FONTS.map(([n,st])=>[n,()=>{
  if(hasSel())ex('fontName',st);else{cur.font=st;applyNote();save();toast('Whole note font changed',1500)}
},`font-family:${st}`]));
$('#sizeBtn').onclick=()=>showPop('size',SIZES.map(([n,v,rem])=>[n,()=>{
  if(hasSel())ex('fontSize',v);else{cur.fs=rem;applyNote();save();toast('Whole note size changed',1500)}
}]));
$('#tc').oninput=e=>{$('#tcU').style.background=e.target.value;ex('foreColor',e.target.value)};
$('#hc').oninput=e=>{$('#hcU').style.background=e.target.value;ex('hiliteColor',e.target.value)};

/* ---------- TRANSPARENCY ---------- */
function toggleClear(){
  const home=$('#home').classList.contains('on'),o=home?S:cur,k=home?'homeA':'a',a=A(o[k]);
  if(a>.05){o.pa=a;o[k]=0;toast('Transparent panels',1400)}else{o[k]=o.pa||.82;toast('Panels back',1400)}
  applyA(A(o[k]));save();
}
$('#clr').onclick=$('#clrHome').onclick=toggleClear;

/* ---------- BACKGROUND ---------- */
const PRESETS=['#ffe3ef','#e3f2ff','#e8ffe3','#fff6d6','#efe3ff','#ffe9dc','#ffffff',
 'linear-gradient(135deg,#ffc3e0,#c3d9ff)','linear-gradient(135deg,#ffe6a7,#ffb3c7)','linear-gradient(135deg,#c3ffe8,#c3c7ff)','linear-gradient(160deg,#2b1f3d,#6b4a8f)','linear-gradient(135deg,#ff9a9e,#fad0c4)'];
$('#sw').innerHTML=PRESETS.map(p=>`<i data-v="${p}" style="background:${p}"></i>`).join('');
function openBg(t){target=t;const a=Math.round(A(t==='home'?S.homeA:cur.a)*100);$('#alpha').value=a;$('#aVal').textContent=a+'%';$('#bgDlg').showModal()}
function setBg(v){if(target==='home')S.homeBg=v;else cur.bg=v;setLayer(v);save()}
$('#sw').onclick=e=>{if(e.target.dataset.v){setBg(e.target.dataset.v);gc()}};
$('#bgColor').oninput=e=>setBg(e.target.value);
$('#bgClear').onclick=()=>{setBg('');gc()};
$('#bgClose').onclick=()=>{$('#bgDlg').close();if(target==='home')renderHome()};
$('#bgHome').onclick=()=>openBg('home');
$('#bgNote').onclick=()=>openBg('note');
$('#alpha').oninput=e=>{
  const a=e.target.value/100;$('#aVal').textContent=e.target.value+'%';
  if(target==='home')S.homeA=a;else cur.a=a;applyA(a);save(true);
};
$('#bgImgBtn').onclick=()=>$('#bgFile').click();
$('#bgFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  toast('Adding image...',1500);
  try{const id=await storeImage(f);setBg('img:'+id);gc();toast('Background set',1200)}
  catch(x){toast('Could not use that image')}
};

/* ---------- WIDGET VIEW ---------- */
function openWidget(id,push){
  if(!use(id))return goHome();
  $('#wt').textContent=cur.title||'Untitled';$('#wb').innerHTML=cur.html;
  applyNote();show('widget');
  if(push){
    history.pushState(null,'','?w='+id);
    try{navigator.clipboard.writeText(location.href)}catch(e){}
    toast('Link copied. Open it in your browser, then menu > Add to Home screen',4500);
  }
}
$('#wHome').onclick=goHome;
$('#wEdit').onclick=()=>{const id=cur.id;history.replaceState(null,'',location.pathname);open(id)};

/* ---------- BACKUP ---------- */
const stamp=()=>{S.lastBackup=Date.now();save();$('#last').textContent='Last backup: just now'};
$('#cloud').onclick=()=>{
  commit(true);pre=null;exportJSON().then(j=>pre=j);
  $('#last').textContent=S.lastBackup?'Last backup: '+new Date(S.lastBackup).toLocaleString():'No backup yet';$('#gDlg').showModal();
};
$('#gClose').onclick=()=>$('#gDlg').close();
$('#up').onclick=async()=>{
  const data=pre||await exportJSON();
  if(navigator.share&&navigator.canShare){
    for(const [n,t] of [['gitnotes-backup.json','application/json'],['gitnotes-backup.txt','text/plain']]){
      try{
        const f=new File([data],n,{type:t});
        if(!navigator.canShare({files:[f]}))continue;
        await navigator.share({files:[f],title:'GitNotes backup'});stamp();return;
      }catch(e){if(e.name==='AbortError')return}
    }
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='gitnotes-backup.json';document.body.appendChild(a);a.click();a.remove();stamp();toast('Saved to your downloads');
  }catch(e){toast('Use Copy text instead')}
};
$('#copy').onclick=async()=>{
  const data=pre||await exportJSON();
  try{await navigator.clipboard.writeText(data)}catch(e){
    const t=document.createElement('textarea');t.value=data;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
  stamp();toast('Copied. Paste it somewhere safe');
};
async function restore(txt){
  let d;
  try{d=JSON.parse(txt);if(!Array.isArray(d.notes))throw 0}catch(x){return toast('That backup looks wrong')}
  if(!confirm('Replace notes on this device with the backup?'))return;
  try{await packData(d);S=d;save();renderHome();$('#gDlg').close();gc();toast('Restored')}catch(x){toast('Restore failed')}
}
$('#down').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{const f=e.target.files[0];if(f)restore(await f.text());e.target.value=''};
$('#paste').onclick=async()=>{
  let t='';try{t=await navigator.clipboard.readText()}catch(e){}
  if(!t)t=prompt('Paste your backup text here:')||'';
  if(t)restore(t);
};

/* ---------- ROUTING + START ---------- */
function route(){
  const p=new URLSearchParams(location.search);
  if(p.get('new')){history.replaceState(null,'',location.pathname);$('#fab').click()}
  else if(p.get('w')&&S.notes.some(n=>n.id===p.get('w')))openWidget(p.get('w'),false);
  else{renderHome();show('home')}
}
window.addEventListener('popstate',route);
route();
if('serviceWorker' in navigator){
  const had=navigator.serviceWorker.controller;let rl=false;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
}
</script>
</body>
</html>
