<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitNotes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GitNotes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito:wght@400;700&family=Poppins:wght@400;600&family=Fredoka:wght@400;600&family=Comfortaa:wght@400;700&family=Baloo+2:wght@400;700&family=Caveat:wght@500;700&family=Patrick+Hand&family=Indie+Flower&family=Kalam:wght@400;700&family=Handlee&family=Architects+Daughter&family=Shadows+Into+Light&family=Gaegu:wght@400;700&family=Mali:wght@400;600&family=Pacifico&family=Dancing+Script:wght@500;700&family=Satisfy&family=Courgette&family=Sacramento&family=Permanent+Marker&family=Chewy&family=Amatic+SC:wght@400;700&family=Lora:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Special+Elite&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#43304a;--soft:#8a7590;--panel:255,255,255;--surf:#fff;--chip:#fff4f8;--hov:#ffe3ef;--dialog:#fffafc;--bd:rgba(255,255,255,.7);--glow:#fff;
--bgc:#ffe9f2;--bg1:#ffe8f1;--bg2:#f3e8ff;--ac1:#ff8fb8;--ac2:#ff6a9f;--acs:#ff6a9f;--actx:#e0457f;
--accent:linear-gradient(135deg,var(--ac1),var(--ac2));--a:.82;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
:root[data-accent=sky]{--bgc:#e3f2ff;--bg1:#e1f1ff;--bg2:#ece8ff;--ac1:#7cc4ff;--ac2:#4a9dff;--acs:#4a9dff;--actx:#2b77d6;--hov:#dcecff;--chip:#eff6ff}
:root[data-accent=mint]{--bgc:#e4fbef;--bg1:#e0fbef;--bg2:#e6f1ff;--ac1:#7fe0b4;--ac2:#2fbf86;--acs:#2fbf86;--actx:#1b9a68;--hov:#d9f6e8;--chip:#effbf5}
:root[data-accent=lavender]{--bgc:#efe6ff;--bg1:#efe6ff;--bg2:#ffe8f6;--ac1:#c3a6ff;--ac2:#8f6bf0;--acs:#8f6bf0;--actx:#6b45d6;--hov:#e9e0ff;--chip:#f5f0ff}
:root[data-accent=peach]{--bgc:#fff0e3;--bg1:#fff0e3;--bg2:#ffe8f0;--ac1:#ffb38a;--ac2:#ff8552;--acs:#ff8552;--actx:#d9602a;--hov:#ffe6d6;--chip:#fff4ec}
:root[data-accent=berry]{--bgc:#ffe6f7;--bg1:#ffe6f7;--bg2:#efe6ff;--ac1:#e87bd0;--ac2:#b83fa8;--acs:#b83fa8;--actx:#a02c8d;--hov:#fbdcf2;--chip:#fff0fa}
:root[data-mode=dark]{color-scheme:dark;--ink:#f3e9f7;--soft:#b3a2bb;--panel:50,37,62;--surf:#3b2d47;--chip:#4a3a58;--hov:#5a4768;--dialog:#2e2238;--bd:rgba(255,255,255,.1);--glow:#000a;--bgc:#1f1626;--bg1:#2a1d35;--bg2:#171021}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bgc)}
body{margin:0;font-family:Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;touch-action:manipulation}
#bgLayer{position:fixed;inset:0;z-index:-1;background:var(--bgc) linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) center/cover no-repeat;transform:translateZ(0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .12s,background .15s}
button:active{transform:scale(.92)}
svg{display:block}
.glass{background:rgba(var(--panel),var(--a));border:1px solid var(--bd);border-radius:22px;box-shadow:0 4px 18px rgba(120,60,110,.1)}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(var(--panel),.94);box-shadow:0 2px 8px rgba(120,60,110,.14);display:grid;place-items:center;flex:none}
.ib.act,.ib.locked{background:var(--accent);color:#fff}
.pill{padding:10px 18px;border-radius:999px;background:var(--surf);box-shadow:0 2px 8px rgba(120,60,110,.14);font-weight:700}
.pill.pri{background:var(--accent);color:#fff}
.pill.sm{padding:8px 14px}
.sp{flex:1}
.clear .glass,.clear .note{box-shadow:none;border-color:transparent}
.clear h1,.clear small.cnt,.clear #title,.clear #body,.clear .note,.clear #wt,.clear #wb,.clear .empty{text-shadow:0 0 5px var(--glow),0 0 10px var(--glow)}

.view{display:none;min-height:100vh;padding:calc(var(--sat) + 16px) 16px 16px;max-width:760px;margin:auto}
.view.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* HOME */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:50px}
.head h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.4px;line-height:1.1}
small.cnt{color:var(--soft);font-weight:600;font-size:.85rem}
.acts{display:flex;gap:7px}
#selbar{padding:5px 8px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;margin-bottom:16px;color:var(--soft)}
#q{flex:1;border:0;outline:0;background:none;color:var(--ink);min-width:0}
#q::placeholder{color:var(--soft)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:120px}
.note{border-radius:22px;padding:15px 15px 30px;height:176px;overflow:hidden;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background-color:rgba(var(--panel),var(--a));background-size:cover;background-position:center;border:1px solid var(--bd);
  box-shadow:0 4px 18px rgba(120,60,110,.1);content-visibility:auto;contain-intrinsic-size:176px;transition:transform .15s}
.note:active{transform:scale(.97)}
.note b{display:block;font-size:1.05rem;margin-bottom:6px;padding-right:18px;text-shadow:0 0 8px var(--glow)}
.note p{margin:0;font-size:.86rem;line-height:1.45;opacity:.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 0 6px var(--glow)}
.note small{position:absolute;left:15px;bottom:11px;font-size:.72rem;color:var(--soft);font-weight:600;text-shadow:0 0 6px var(--glow)}
.note .pinI{position:absolute;top:12px;right:12px;color:var(--acs)}
.note .chk{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--surf);border:2px solid #e2d2e6;display:none;place-items:center;color:#fff}
.selmode .note .chk{display:grid}.selmode .note .pinI{display:none}
.note.sel{outline:3px solid var(--acs);outline-offset:-3px;transform:scale(.97)}
.note.sel .chk{background:var(--accent);border-color:transparent}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--soft);font-weight:600}
.empty div{font-size:2.4rem;margin-bottom:8px}
#fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(var(--sab) + 22px);width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(255,90,150,.35);z-index:5;display:grid;place-items:center}

/* EDITOR */
.top{display:flex;align-items:center;gap:4px;padding:2px 0;position:sticky;top:calc(var(--sat) + 6px);z-index:6;margin-bottom:10px}
.top .ib,.wbtn{background:none;box-shadow:none;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 1px var(--glow))}
.top .ib.act,.top .ib.locked{background:none;color:var(--acs)}
#title{width:100%;border:0;outline:0;padding:16px 20px;margin-bottom:12px;font-size:1.65rem;font-weight:800;font-family:inherit;color:var(--ink);border-radius:22px}
#title::placeholder{color:var(--soft)}
#body{padding:20px;min-height:56vh;outline:0;line-height:1.7;font-size:1.05rem;word-break:break-word;margin-bottom:100px}
#body:empty:before{content:attr(data-ph);opacity:.4}
#body ul,#body ol{margin:.4em 0;padding-left:1.5em}
#dock{position:fixed;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);width:min(736px,calc(100% - 24px));
  display:flex;gap:2px;align-items:center;padding:7px;overflow-x:auto;z-index:7;transition:transform .25s,opacity .25s;scrollbar-width:none;background:rgba(var(--panel),.97);border-radius:22px;box-shadow:0 8px 26px rgba(120,60,110,.22)}
#dock::-webkit-scrollbar{display:none}
#dock.hide{transform:translate(-50%,150%);opacity:0;pointer-events:none}
#dock button,#dock label{min-width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;position:relative;font-weight:700;padding:0 6px;grid-auto-flow:column;gap:1px}
#dock button:active,#dock label:active{background:var(--hov)}
#dock button.act{background:var(--hov);color:var(--actx)}
#dock label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#dock label u{position:absolute;bottom:5px;left:10px;right:10px;height:3px;border-radius:3px}
.sep{width:1px;height:22px;background:var(--soft);opacity:.3;flex:none;margin:0 3px}
#pop,#menu{position:fixed;display:none;z-index:9;background:var(--surf);border-radius:20px;padding:8px;box-shadow:0 12px 34px #0004}
#pop{left:50%;bottom:calc(var(--sab) + 78px);transform:translateX(-50%);flex-wrap:wrap;gap:6px;max-width:min(380px,92vw);justify-content:center}
#menu{right:max(16px,calc(50% - 364px));top:calc(var(--sat) + 62px);flex-direction:column;min-width:200px}
#pop.on,#menu.on{display:flex;animation:pop .15s}
#pop button{padding:9px 15px;border-radius:12px;background:var(--chip);font-size:1rem}
#pop.fonts.on{display:grid;grid-template-columns:1fr 1fr;width:min(360px,92vw);max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pop.fonts button{text-align:left;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 12px}
#pop.size.on{flex-direction:column;align-items:stretch;gap:12px;width:min(340px,92vw)}
.szrow{display:flex;align-items:center;justify-content:center;gap:16px}
.szrow button{width:46px;height:46px;border-radius:50%;font-size:1.5rem;font-weight:700;padding:0!important}
#szNum{font-size:1.7rem;min-width:60px;text-align:center}
.szchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.szchips button{min-width:46px;padding:8px 10px!important;font-weight:700}
#menu button{padding:12px 14px;border-radius:12px;text-align:left;font-weight:600}
#menu button:active{background:var(--hov)}

/* PAPER SKINS (editor + widget only) */
.sk-notebook{--pc:255,251,240;--ps:44px 32px,100% 100%,100% 100%,100% 32px;--pr:repeat-y,no-repeat,no-repeat,repeat;
 --pi:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='32'><ellipse cx='25' cy='16' rx='6' ry='5' fill='%23eadfcb' stroke='%23d2c4aa'/><path d='M3 21C13 25 29 9 41 12' fill='none' stroke='%23857d9c' stroke-width='3.4' stroke-linecap='round'/><path d='M3 20C13 24 29 8 41 11' fill='none' stroke='%23d9d4ea' stroke-width='1.2' stroke-linecap='round'/></svg>"),linear-gradient(90deg,#f2e8d5 0 44px,transparent 44px),linear-gradient(90deg,transparent 64px,#ffc4d0 64px 65px,transparent 65px),repeating-linear-gradient(transparent 0 31px,#e8dfcc 31px 32px)}
.sk-lined{--pc:255,254,248;--ps:100% 32px;--pr:repeat;--pi:repeating-linear-gradient(transparent 0 31px,#d6e4f5 31px 32px)}
.sk-grid{--pc:255,254,248;--ps:28px 28px;--pr:repeat;--pi:linear-gradient(#dfe9f5 1px,transparent 1px),linear-gradient(90deg,#dfe9f5 1px,transparent 1px)}
.sk-dots{--pc:255,254,248;--ps:28px 28px;--pr:repeat;--pi:radial-gradient(#c8bcd2 1.4px,transparent 1.7px)}
.sk-notebook #body,.sk-notebook #wcard,.sk-notebook #title,.sk-lined #body,.sk-lined #wcard,.sk-lined #title,
.sk-grid #body,.sk-grid #wcard,.sk-dots #body,.sk-dots #wcard{
 background-color:rgba(var(--pc),var(--a));background-image:var(--pi);background-size:var(--ps);background-repeat:var(--pr);background-attachment:local;color:#43304a;border:0}
.sk-notebook #title,.sk-lined #title{height:64px;line-height:32px;padding:16px 20px;margin-bottom:0;border-radius:22px 22px 0 0;font-size:1.5rem}
.sk-notebook #title{padding-left:70px;border-radius:12px 24px 0 0}
.sk-notebook #body,.sk-lined #body{line-height:32px;padding:0 20px 32px;border-radius:0 0 22px 22px}
.sk-notebook #body{padding-left:70px;border-radius:0 0 24px 12px}
.sk-notebook #wcard,.sk-lined #wcard{line-height:32px;padding:32px 20px}
.sk-notebook #wcard{padding-left:70px;border-radius:12px 24px 24px 12px}
.sk-grid #body,.sk-grid #wcard,.sk-dots #body,.sk-dots #wcard{line-height:28px;padding:28px 20px}
.sk-notebook #wt,.sk-lined #wt{line-height:32px;margin:0}

/* WIDGET VIEW */
#widget.on{display:flex;flex-direction:column;justify-content:center}
#wcard{padding:28px;min-height:58vh}
#wt{margin:0 0 12px;font-size:1.7rem;font-weight:800}
#wb{line-height:1.7;font-size:1.1rem;word-break:break-word}
.sk-notebook #wb,.sk-lined #wb{line-height:32px}
.wbtn{position:fixed;bottom:calc(var(--sab) + 20px)}
#wHome{left:18px}#wEdit{right:18px}

/* DIALOGS */
dialog{border:0;border-radius:28px;padding:22px;width:min(390px,92vw);color:var(--ink);box-shadow:0 24px 70px #0005;background:var(--dialog)}
dialog[open]{animation:pop .2s}
dialog::backdrop{background:#2b1630aa}
dialog h3{margin:0 0 14px;font-size:1.25rem}
dialog p{font-size:.88rem;color:var(--soft);margin:10px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.sws{display:flex;gap:9px;flex-wrap:wrap}
.sws i{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0003;cursor:pointer}
.sws i.on{outline:3px solid var(--ink);outline-offset:2px}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin:18px 0 8px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:999px;font-weight:700}
.seg button.on,.chips button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:700}
input[type=range]{width:100%;accent-color:var(--acs);height:28px}
input[type=color]{width:42px;height:34px;border:0;border-radius:10px;padding:0;background:none;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,16px);background:#2f2236;color:#fff;padding:11px 18px;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;font-weight:600;max-width:90vw;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px #0004;border:1px solid #ffffff22}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#tact{color:#ffb3d1;font-weight:800}
</style>
</head>
<body>
<div id="bgLayer"></div>

<!-- HOME -->
<div id="home" class="view on">
  <div id="hdr" class="head">
    <div><h1>GitNotes</h1><small class="cnt" id="count"></small></div>
    <div class="acts">
      <button class="ib clrb" id="clrHome" data-ic="drop" title="Transparent panels"></button>
      <button class="ib" id="bgHome" data-ic="palette" title="Background"></button>
      <button class="ib" id="themeBtn" data-ic="sun" title="Theme"></button>
      <button class="ib" id="cloud" data-ic="cloud" title="Backup"></button>
    </div>
  </div>
  <div id="selbar" class="head glass" hidden>
    <button class="ib" id="selX" data-ic="close"></button>
    <b id="selCount"></b><span class="sp"></span>
    <button class="pill sm" id="selAll">All</button>
    <button class="ib" id="selPin" data-ic="pin"></button>
    <button class="ib" id="selDel" data-ic="trash"></button>
  </div>
  <label class="search glass"><span data-ic="search"></span><input id="q" placeholder="Search notes"></label>
  <div id="grid"></div>
  <button id="fab" data-ic="plus" data-sz="28" title="New note"></button>
</div>

<!-- EDITOR -->
<div id="editor" class="view">
  <div class="top">
    <button class="ib" id="back" data-ic="back" title="Back"></button>
    <span class="sp"></span>
    <button class="ib" id="lock" title="Lock / unlock editing"></button>
    <button class="ib clrb" id="clr" data-ic="drop" title="Transparent panels"></button>
    <button class="ib" id="bgNote" data-ic="palette" title="Background"></button>
    <button class="ib" id="more" data-ic="more" title="More"></button>
  </div>
  <input id="title" class="glass" placeholder="Heading">
  <div id="body" class="glass" contenteditable="true" inputmode="text" data-ph="Write something cute..."></div>
  <div id="dock">
    <button data-c="undo" data-ic="undo"></button>
    <button data-c="redo" data-ic="redo"></button>
    <span class="sep"></span>
    <button data-c="bold"><b>B</b></button>
    <button data-c="italic"><i>I</i></button>
    <button data-c="underline"><u>U</u></button>
    <button data-c="strikeThrough"><s>S</s></button>
    <span class="sep"></span>
    <button data-c="insertUnorderedList" data-ic="ul"></button>
    <button data-c="insertOrderedList" data-ic="ol"></button>
    <button data-c="justifyLeft" data-ic="left"></button>
    <button data-c="justifyCenter" data-ic="center"></button>
    <span class="sep"></span>
    <button id="fontBtn">Aa</button>
    <button id="sizeBtn"><span style="font-size:.78em">A</span><span style="font-size:1.2em">A</span></button>
    <span class="sep"></span>
    <label title="Text color">A<u id="tcU" style="background:#43304a"></u><input type="color" id="tc" value="#43304a"></label>
    <label title="Highlight"><span data-ic="marker"></span><u id="hcU" style="background:#fff3a3"></u><input type="color" id="hc" value="#fff3a3"></label>
  </div>
  <div id="pop"></div>
  <div id="menu"></div>
</div>

<!-- WIDGET VIEW -->
<div id="widget" class="view">
  <div id="wcard" class="glass"><h2 id="wt"></h2><div id="wb"></div></div>
  <button class="ib wbtn" id="wHome" data-ic="home"></button>
  <button class="ib wbtn" id="wEdit" data-ic="edit"></button>
</div>

<!-- BACKGROUND -->
<dialog id="bgDlg">
  <h3>Background</h3>
  <div class="sws" id="sw"></div>
  <div class="row">
    <label class="pill" style="display:flex;gap:8px;align-items:center">Color <input type="color" id="bgColor" value="#ffe3ef"></label>
    <button class="pill" id="bgImgBtn">Image</button>
    <button class="pill" id="bgClear">Reset</button>
  </div>
  <div class="lbl"><span>Panel transparency</span><span id="aVal"></span></div>
  <input type="range" id="alpha" min="0" max="100">
  <div id="paperBox"><div class="lbl"><span>Paper</span></div><div class="chips" id="skinNote"></div></div>
  <input type="file" id="bgFile" accept="image/*" hidden>
  <div class="row"><button class="pill pri" id="bgClose">Done</button></div>
</dialog>

<!-- THEME -->
<dialog id="thDlg">
  <h3>Theme</h3>
  <div class="lbl" style="margin-top:0"><span>Mode</span></div>
  <div class="seg" id="modeSeg"><button data-m="auto">System</button><button data-m="light">Light</button><button data-m="dark">Dark</button></div>
  <div class="lbl"><span>Accent</span></div>
  <div class="sws" id="acSw"></div>
  <div class="lbl"><span>Default paper for notes</span></div>
  <div class="chips" id="skinHome"></div>
  <div class="row"><button class="pill pri" id="thClose">Done</button></div>
</dialog>

<!-- BACKUP -->
<dialog id="gDlg">
  <h3>Backup</h3>
  <p style="margin-top:0">Back up opens your share sheet, so pick <b>Drive</b>, Files, WhatsApp, etc. No share sheet? It downloads instead. Images are included.</p>
  <div class="row"><button class="pill pri" id="up">Back up</button><button class="pill" id="down">Restore file</button></div>
  <div class="row"><button class="pill" id="copy">Copy text</button><button class="pill" id="paste">Paste text</button></div>
  <input type="file" id="impFile" hidden>
  <p id="last"></p>
  <div class="row"><button class="pill" id="gClose">Close</button></div>
</dialog>

<div id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<script>
const $=s=>document.querySelector(s);

/* ---------- icons ---------- */
const IC={
 back:'<path d="M15 18l-6-6 6-6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 unlock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 017.6-1.7"/>',

/* ---------- image storage (IndexedDB, keeps notes data tiny) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('gitnotes',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction('imgs',mode),q=fn(t.objectStore('imgs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const idbPut=(k,v)=>idb('readwrite',s=>s.put(v,k));
const idbGet=k=>idb('readonly',s=>s.get(k));
const idbDel=k=>idb('readwrite',s=>s.delete(k));
const loadImg=b=>new Promise((res,rej)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
const scale=(im,max,q)=>new Promise(res=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',q)});
async function storeImage(blob){
  const im=await loadImg(blob),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await idbPut('f:'+id,await scale(im,1280,.82));await idbPut('t:'+id,await scale(im,360,.7));return id;
}
const urls=new Map();
async function getURL(key){
  if(urls.has(key))return urls.get(key);
  const b=await idbGet(key);if(!b)return null;
  const u=URL.createObjectURL(b);urls.set(key,u);return u;
}
const cssBg=v=>v.startsWith('#')?`linear-gradient(${v},${v})`:v.startsWith('data:')?`url(${v})`:v;
function paint(el,v,thumb){
  el.dataset.bg=v||'';
  if(!v){el.style.backgroundImage='';return}
  if(v.startsWith('img:')){
    const key=(thumb?'t:':'f:')+v.slice(4);
    if(urls.has(key)){el.style.backgroundImage=`url(${urls.get(key)})`;return}
    el.style.backgroundImage='';
    getURL(key).then(u=>{if(u&&el.dataset.bg===v)el.style.backgroundImage=`url(${u})`});
    return;
  }
  el.style.backgroundImage=cssBg(v);
}
const setLayer=v=>paint($('#bgLayer'),v,false);
async function gc(){
  try{
    const used=new Set([S.homeBg,...S.notes.map(n=>n.bg)].filter(v=>v&&v.startsWith('img:')).map(v=>v.slice(4)));
    const keys=await idb('readonly',s=>s.getAllKeys());
    for(const k of keys)if(!used.has(k.slice(2))){await idbDel(k);urls.delete(k)}
  }catch(e){}
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function toData(v){if(v&&v.startsWith('img:')){const b=await idbGet('f:'+v.slice(4));if(b)return blobToData(b)}return v}
async function toRef(v){if(v&&v.startsWith('data:')){const b=await (await fetch(v)).blob();return 'img:'+await storeImage(b)}return v}
async function exportJSON(){
  const d=JSON.parse(JSON.stringify(S));d.homeBg=await toData(d.homeBg);
  for(const n of d.notes)n.bg=await toData(n.bg);
  return JSON.stringify(d);
}
async function packData(d){d.homeBg=await toRef(d.homeBg);for(const n of d.notes)n.bg=await toRef(n.bg);return d}
(async()=>{ // migrate any old inline images
  try{
    const old=[S.homeBg,...S.notes.map(n=>n.bg)].some(v=>v&&v.startsWith('data:'));
    if(!old)return;

function renderHome(){
  setLayer(S.homeBg);applyA(A(S.homeA));
  $('#count').textContent=S.notes.length?S.notes.length+(S.notes.length===1?' note':' notes'):'';
  const q=$('#q').value.trim().toLowerCase(),g=$('#grid');
  const list=[...S.notes].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t).filter(n=>!q||(n.title+' '+textOf(n)).toLowerCase().includes(q));
  if(!list.length){g.innerHTML=`<div class="empty glass"><div>${q?'🔍':'🌷'}</div>${q?'Nothing found':'No notes yet<br>Tap + to make your first one'}</div>`;return}
  const frag=document.createDocumentFragment();
  list.forEach((n,i)=>{
    const d=document.createElement('div');d.className='note'+(sel.has(n.id)?' sel':'');d.dataset.id=n.id;
    if(first)d.style.animation=`pop .3s ${Math.min(i,10)*30}ms both`;
    paint(d,n.bg,true);
    d.innerHTML=`<b>${esc(n.title||'Untitled')}</b><p>${esc(textOf(n).slice(0,140))}</p><small>${new Date(n.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small>${n.pin?`<span class="pinI">${svg('pin',16)}</span>`:''}<span class="chk">${svg('check',16)}</span>`;
    frag.appendChild(d);
  });
  g.replaceChildren(frag);first=false;
}

/* numeric font size */
function curPx(){
  if(hasSel()){const n=saved.startContainer,el=n.nodeType===3?n.parentElement:n;return Math.round(parseFloat(getComputedStyle(el).fontSize))}
  return fsPx(cur.fs)||Math.round(parseFloat(getComputedStyle($('#body')).fontSize));
}
function applySize(px){
  if(!hasSel()){cur.fs=px;applyNote();save();return}
  quiet(()=>{
    document.execCommand('styleWithCSS',false,false);
    document.execCommand('fontSize',false,'7');
    const made=[];
    $('#body').querySelectorAll('font[size="7"],span[style*="xxx-large"]').forEach(f=>{
      if(f.tagName==='FONT'){const s=document.createElement('span');s.style.fontSize=px+'px';while(f.firstChild)s.appendChild(f.firstChild);f.replaceWith(s);made.push(s)}
      else{f.style.fontSize=px+'px';made.push(f)}
    });
    if(made.length){
      const r=document.createRange();r.setStartBefore(made[0]);r.setEndAfter(made[made.length-1]);
      const s=getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange();
    }
  });
  commit();
}

  const num=document.createElement('b');num.id='szNum';num.textContent=curPx();
  const mk=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onmousedown=e=>e.preventDefault();b.onclick=fn;return b};
  const set=n=>{n=Math.max(8,Math.min(120,n));applySize(n);num.textContent=n};
  const row=document.createElement('div');row.className='szrow';row.append(mk('\u2212',()=>set(curPx()-2)),num,mk('+',()=>set(curPx()+2)));
  const ch=document.createElement('div');ch.className='szchips';
  [12,14,16,18,20,24,28,32,40,48,64].forEach(n=>ch.append(mk(n,()=>set(n))));
  p.append(row,ch);p.classList.add('on');
  if(!hasSel())toast('No text selected, so this sizes the whole note',1800);
}
$('#sizeBtn').onclick=sizePop;
$('#tc').oninput=e=>$('#tcU').style.background=e.target.value;
$('#hc').oninput=e=>$('#hcU').style.background=e.target.value;
$('#tc').onchange=e=>ex('foreColor',e.target.value);
$('#hc').onchange=e=>ex('hiliteColor',e.target.value);

/* ---------- TRANSPARENCY ---------- */
function toggleClear(){
  const home=$('#home').classList.contains('on'),o=home?S:cur,k=home?'homeA':'a',a=A(o[k]);
  if(a>.05){o.pa=a;o[k]=0;toast('Transparent panels',1400)}else{o[k]=o.pa||.82;toast('Panels back',1400)}
  applyA(A(o[k]));save();
}
$('#clr').onclick=$('#clrHome').onclick=toggleClear;

/* ---------- BACKGROUND ---------- */
const PRESETS=['#ffe3ef','#e3f2ff','#e8ffe3','#fff6d6','#efe3ff','#ffe9dc','#ffffff',
 'linear-gradient(135deg,#ffc3e0,#c3d9ff)','linear-gradient(135deg,#ffe6a7,#ffb3c7)','linear-gradient(135deg,#c3ffe8,#c3c7ff)','linear-gradient(160deg,#2b1f3d,#6b4a8f)','linear-gradient(135deg,#ff9a9e,#fad0c4)'];
$('#sw').innerHTML=PRESETS.map(p=>`<i data-v="${p}" style="background:${p}"></i>`).join('');
function openBg(t){target=t;$('#paperBox').hidden=t==='home';if(t!=='home')chips($('#skinNote'),()=>skinOf(cur),k=>{cur.skin=k;applyNote();save()});const a=Math.round(A(t==='home'?S.homeA:cur.a)*100);$('#alpha').value=a;$('#aVal').textContent=a+'%';$('#bgDlg').showModal()}
function setBg(v){if(target==='home')S.homeBg=v;else cur.bg=v;setLayer(v);save()}
$('#sw').onclick=e=>{if(e.target.dataset.v){setBg(e.target.dataset.v);gc()}};
$('#bgColor').oninput=e=>setBg(e.target.value);
$('#bgClear').onclick=()=>{setBg('');gc()};
$('#bgClose').onclick=()=>{$('#bgDlg').close();if(target==='home')renderHome()};
$('#bgHome').onclick=()=>openBg('home');
$('#bgNote').onclick=()=>openBg('note');
$('#alpha').oninput=e=>{
  const a=e.target.value/100;$('#aVal').textContent=e.target.value+'%';
  if(target==='home')S.homeA=a;else cur.a=a;applyA(a);save(true);
};
$('#bgImgBtn').onclick=()=>$('#bgFile').click();
$('#bgFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  toast('Adding image...',1500);
  try{const id=await storeImage(f);setBg('img:'+id);gc();toast('Background set',1200)}
  catch(x){toast('Could not use that image')}
};

/* ---------- WIDGET VIEW ---------- */
function openWidget(id,push){
  if(!use(id))return goHome();
  $('#wt').textContent=cur.title||'Untitled';$('#wb').innerHTML=cur.html;
  applyNote();show('widget');
  if(push){
    history.replaceState({v:'note'},'','?w='+id);
    try{navigator.clipboard.writeText(location.href)}catch(e){}
    toast('Link copied. Open it in your browser, then menu > Add to Home screen',4500);
  }
}
$('#wHome').onclick=goHome;
$('#wEdit').onclick=()=>{const id=cur.id;history.replaceState({v:'note'},'',location.pathname);open(id)};

/* ---------- BACKUP ---------- */
const stamp=()=>{S.lastBackup=Date.now();save();$('#last').textContent='Last backup: just now'};
$('#cloud').onclick=()=>{
  commit(true);pre=null;exportJSON().then(j=>pre=j);
  $('#last').textContent=S.lastBackup?'Last backup: '+new Date(S.lastBackup).toLocaleString():'No backup yet';$('#gDlg').showModal();
};
$('#gClose').onclick=()=>$('#gDlg').close();
$('#up').onclick=async()=>{
  const data=pre||await exportJSON();
  if(window.Android){Android.saveFile('gitnotes-backup.json',data);return}
  if(navigator.share&&navigator.canShare){
    for(const [n,t] of [['gitnotes-backup.json','application/json'],['gitnotes-backup.txt','text/plain']]){
      try{
        const f=new File([data],n,{type:t});
        if(!navigator.canShare({files:[f]}))continue;
        await navigator.share({files:[f],title:'GitNotes backup'});stamp();return;
      }catch(e){if(e.name==='AbortError')return}
    }
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='gitnotes-backup.json';document.body.appendChild(a);a.click();a.remove();stamp();toast('Saved to your downloads');
  }catch(e){toast('Use Copy text instead')}
};
$('#copy').onclick=async()=>{
  const data=pre||await exportJSON();
  try{await navigator.clipboard.writeText(data)}catch(e){
    const t=document.createElement('textarea');t.value=data;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
  stamp();toast('Copied. Paste it somewhere safe');
};
async function restore(txt){
  let d;
  try{d=JSON.parse(txt);if(!Array.isArray(d.notes))throw 0}catch(x){return toast('That backup looks wrong')}
  if(!confirm('Replace notes on this device with the backup?'))return;
  try{await packData(d);S=d;save();renderHome();$('#gDlg').close();gc();toast('Restored')}catch(x){toast('Restore failed')}
}
$('#down').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{const f=e.target.files[0];if(f)restore(await f.text());e.target.value=''};
$('#paste').onclick=async()=>{
  let t='';try{t=await navigator.clipboard.readText()}catch(e){}
  if(!t)t=prompt('Paste your backup text here:')||'';
  if(t)restore(t);
};

/* ---------- ROUTING + START ---------- */
function route(){
  const p=new URLSearchParams(location.search);
  if(p.get('new')){history.replaceState(null,'',location.pathname);$('#fab').click()}
  else if(p.get('w')&&S.notes.some(n=>n.id===p.get('w')))openWidget(p.get('w'),false);
  else{if(cur){commit(true);cur=null}renderHome();show('home')}
}
window.addEventListener('popstate',()=>{
  if(selMode){exitSel();return}
  closePops();route();
});
/* system back button (used by the Android app; browsers use popstate above) */
window.handleBack=()=>{
  const dlg=document.querySelector('dialog[open]');
  if(dlg){dlg.close();return true}
  if($('#pop').classList.contains('on')||$('#menu').classList.contains('on')){closePops();return true}
  if(selMode){leaveSel();return true}
  if(!$('#home').classList.contains('on')){if(cur)commit(true);goHome();return true}
  if($('#q').value){$('#q').value='';renderHome();return true}
  return false;
};
window.onNativeSaved=ok=>{if(ok){stamp();toast('Backup saved')}else toast('Backup cancelled')};
route();
if('serviceWorker' in navigator&&!window.Android){
  const had=navigator.serviceWorker.controller;let rl=false;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
}
</script>
</body>
</html>
